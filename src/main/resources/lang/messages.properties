cmd.help.header=== FFCraft 命令 ===
cmd.help.create=/ffcraft create <名称> [public|private]  — 需要创建权限
cmd.help.list=/ffcraft list                             — 列出所有播放器
cmd.help.info=/ffcraft info <uuid>                        — 查看详情
cmd.help.rename=/ffcraft rename <uuid> <新名称>           — 需要管理权限
cmd.help.delete=/ffcraft delete <uuid>                      — 需要删除权限
cmd.help.setpublic=/ffcraft setpublic <uuid> <true|false>     — 需要切换权限
cmd.help.grant=/ffcraft grant <播放器ID> <玩家名>    — 需要管理权限
cmd.help.revoke=/ffcraft revoke <播放器ID> <玩家名>   — 需要管理权限
cmd.help.reload=/ffcraft reload                           — 重新同步所有客户端（需要重载权限）

